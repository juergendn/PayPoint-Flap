{% extends "admin/anmeldung_basis.html" %}
{% block titel %}Anmeldung – MVT-Klappenautomat{% endblock %}
{% block formular %}
<form method="post" action="/admin/login">
  <input type="hidden" name="weiter_zu" value="{{ weiter_zu }}" />
  <div class="form-group">
    <label for="login">Login</label>
    <input id="login" name="login" value="{{ login or '' }}" autocomplete="username" autofocus required />
  </div>
  <div class="form-group">
    <label for="passwort">Passwort</label>
    <input id="passwort" name="passwort" type="password" autocomplete="current-password" required />
  </div>
  <button class="btn btn-primary btn-block">Anmelden</button>
</form>
{% endblock %}
