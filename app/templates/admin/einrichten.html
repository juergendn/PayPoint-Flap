{% extends "admin/anmeldung_basis.html" %}
{% block titel %}Ersteinrichtung – MVT-Klappenautomat{% endblock %}
{% block formular %}
<p class="text-muted">Noch kein Benutzer vorhanden. Lege den ersten Administrator an.</p>
<form method="post" action="/admin/einrichten">
  <div class="form-group">
    <label for="login">Login</label>
    <input id="login" name="login" value="{{ login or 'admin' }}" required />
  </div>
  <div class="form-group">
    <label for="passwort">Passwort (mind. 8 Zeichen)</label>
    <input id="passwort" name="passwort" type="password" autocomplete="new-password" required minlength="8" />
  </div>
  <div class="form-group">
    <label for="passwort2">Passwort wiederholen</label>
    <input id="passwort2" name="passwort2" type="password" autocomplete="new-password" required />
  </div>
  <button class="btn btn-primary btn-block">Administrator anlegen</button>
</form>
{% endblock %}
